
<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101827">
  <meta name="description" content="BetPredict AI — resultados e análise desportiva">
  <link rel="manifest" href="manifest.webmanifest">
  <title>BetPredict AI</title>
  <style>
    :root{color-scheme:dark;--bg:#0b1220;--panel:#131e30;--panel2:#1b2940;--text:#f4f7fb;--muted:#9aa9bd;--accent:#35d39a;--line:#26354c}
    *{box-sizing:border-box}
    body{margin:0;background:linear-gradient(160deg,#101c30,#080e19 60%);font:16px system-ui,-apple-system,sans-serif;color:var(--text);min-height:100vh}
    header{padding:26px 18px 18px;max-width:850px;margin:auto}
    .brand{display:flex;align-items:center;gap:12px}
    .logo{width:44px;height:44px;border-radius:14px;background:var(--accent);color:#062218;display:grid;place-items:center;font-weight:900;font-size:20px}
    h1{font-size:22px;margin:0}
    header p{color:var(--muted);margin:5px 0 0;font-size:13px}
    main{max-width:850px;margin:auto;padding:0 16px 40px}
    .notice{background:#172b29;border:1px solid #285b4c;color:#b9f2dc;border-radius:13px;padding:12px 14px;font-size:13px;line-height:1.45;margin-bottom:18px}
    .tabs{display:flex;gap:8px;margin:16px 0}
    .tabs button{border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:10px 16px;border-radius:999px;font-weight:650}
    .tabs button.active{background:var(--accent);color:#062218;border-color:var(--accent)}
    .section-title{display:flex;justify-content:space-between;align-items:center;margin:22px 2px 12px}
    .section-title h2{font-size:17px;margin:0}
    .section-title span{font-size:12px;color:var(--muted)}
    .game{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:15px;margin-bottom:11px}
    .league{font-size:11px;color:var(--muted);margin-bottom:13px}
    .teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;text-align:center;font-weight:700}
    .vs{color:var(--muted);font-size:12px}
    .meta{display:flex;justify-content:space-between;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
    .pill{color:var(--accent);font-weight:700}
    .analysis{background:var(--panel2);padding:12px;border-radius:12px;margin-top:12px;font-size:13px}
    .analysis p{margin:7px 0}
    .bars{display:flex;gap:4px;margin:10px 0 7px;height:9px}
    .bar{height:9px;border-radius:8px;background:var(--accent)}
    .bar.draw{background:#e5b84b}
    .bar.other{background:#6983a8}
    .percentages{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;text-align:center}
    .percentages div{background:#101a2a;border-radius:9px;padding:8px 3px}
    .percentages strong{display:block;font-size:17px}
    .percentages small{font-size:10px;color:var(--muted)}
    .muted{color:var(--muted)}
    footer{text-align:center;color:var(--muted);font-size:12px;padding:24px 8px}
    @media(min-width:650px){.games{display:grid;grid-template-columns:1fr 1fr;gap:12px}.game{margin:0}}
  </style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">BP</div>
    <div>
      <h1>BetPredict AI</h1>
      <p>Centro de resultados e análise desportiva</p>
    </div>
  </div>
</header>

<main>

  <div class="tabs" role="tablist">
    <button class="active" data-sport="football">⚽ Futebol</button>
    <button data-sport="basketball">🏀 Basquetebol</button>
  </div>

  <div class="section-title">
    <h2 id="heading">Jogos de futebol</h2>
    <span>À procura de jogos...</span>
  </div>

  <div id="games" class="games"></div>

  <footer>
    BetPredict AI · As previsões são estimativas, não garantias.
    Não arrisques dinheiro que não podes perder.
  </footer>
</main>

<script src="api.js"></script>
<script>
const root = document.querySelector("#games");
const heading = document.querySelector("#heading");
const subtitle = document.querySelector(".section-title span");

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[char]));
}

function formatDate(date, time) {
  if (!date) return time || "Horário por confirmar";

  const parts = date.split("-");
  const formatted = parts.length === 3
    ? `${parts[2]}/${parts[1]}/${parts[0]}`
    : date;

  return `${formatted} · ${time || "Hora por confirmar"}`;
}

// Traduz os nomes das competições para as chaves usadas no histórico
function identifyLeague(name) {
  const value = String(name || "")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9]/g, "");

  if (value.includes("championsleague")) {
    return "champions";
  }

  if (value.includes("europaleague")) {
    return "europa";
  }

  if (value.includes("conferenceleague")) {
    return "europa";
  }

  if (value.includes("primeira") || value.includes("portugal")) {
    return "portugal";
  }

  if (value.includes("laliga") || value.includes("spanish")) {
    return "espanha";
  }

  if (value.includes("seriea") || value.includes("italy") ||
      value.includes("italian")) {
    return "italia";
  }

  if (value.includes("ligue1") || value.includes("france") ||
      value.includes("french")) {
    return "franca";
  }

  if (value.includes("premierleague") || value.includes("england") ||
      value.includes("english")) {
    return "inglaterra";
  }

  if (value.includes("bundesliga") || value.includes("germany") ||
      value.includes("german")) {
    return "alemanha";
  }

  if (value.includes("eredivisie") || value.includes("netherlands") ||
      value.includes("dutch")) {
    return "paises baixos";
  }

  return null;
}
function predictionHTML(prediction) {
  if (!prediction || prediction.status !== "Previsão estatística") {
    const reason = prediction?.reason || "Ainda não existem dados suficientes.";

    return `
      <div class="analysis">
        <strong>Previsão</strong>
        <p class="muted">Dados insuficientes: ${escapeHTML(reason)}</p>
      </div>`;
  }

  return `
    <div class="analysis">
      <strong>Probabilidades estimadas</strong>
      <div class="bars">
        <div class="bar" style="width:${prediction.casa}%"></div>
        <div class="bar draw" style="width:${prediction.empate}%"></div>
        <div class="bar other" style="width:${prediction.fora}%"></div>
      </div>
      <div class="percentages">
        <div>
          <strong>${prediction.casa}%</strong>
          <small>Vitória casa</small>
        </div>
        <div>
          <strong>${prediction.empate}%</strong>
          <small>Empate</small>
        </div>
        <div>
          <strong>${prediction.fora}%</strong>
          <small>Vitória fora</small>
        </div>
      </div>
      <p class="muted">
        Baseado em ${prediction.jogosCasa} jogos da equipa da casa
        e ${prediction.jogosFora} da visitante.
      </p>
      <p class="muted">
        Modelo estatístico experimental. Não é uma garantia de resultado.
      </p>
    </div>`;
}

async function renderFootballGame(game) {
  const homeRaw = game.strHomeTeam || "Equipa da casa";
  const awayRaw = game.strAwayTeam || "Equipa visitante";
  const leagueRaw = game.strLeague || "Competição";

  const home = escapeHTML(homeRaw);
  const away = escapeHTML(awayRaw);
  const league = escapeHTML(leagueRaw);

  const played =
    game.intHomeScore !== null &&
    game.intHomeScore !== undefined &&
    game.intAwayScore !== null &&
    game.intAwayScore !== undefined;

  const leagueKey = identifyLeague(leagueRaw);

  let prediction = null;

  if (leagueKey && window.BetPredictAPI?.getFootballPrediction) {
    try {
      prediction = await window.BetPredictAPI.getFootballPrediction(
        homeRaw,
        awayRaw,
        leagueKey,
        game.dateEvent || new Date().toISOString().slice(0, 10)
      );
    } catch (error) {
      console.error("Erro na previsão:", error);
    }
  } else {
    prediction = {
      status: "Dados insuficientes",
      reason: "Competição ainda não suportada pelo histórico"
    };
  }

  return `
    <article class="game">
      <div class="league">${league}</div>
      <div class="teams">
        <div>${home}</div>
        <div class="vs">${played
          ? `${escapeHTML(game.intHomeScore)} - ${escapeHTML(game.intAwayScore)}`
          : "VS"}</div>
        <div>${away}</div>
      </div>
      <div class="meta">
        <span>${escapeHTML(formatDate(game.dateEvent, game.strTime))}</span>
        <span class="pill">${played ? "Resultado" : "Jogo agendado"}</span>
      </div>
      ${predictionHTML(prediction)}
    </article>`;
}

function renderBasketballGame(game) {
  const home = escapeHTML(game.strHomeTeam || "Equipa da casa");
  const away = escapeHTML(game.strAwayTeam || "Equipa visitante");
  const league = escapeHTML(game.strLeague || "Competição");

  const played =
    game.intHomeScore !== null &&
    game.intHomeScore !== undefined &&
    game.intAwayScore !== null &&
    game.intAwayScore !== undefined;

  return `
    <article class="game">
      <div class="league">${league}</div>
      <div class="teams">
        <div>${home}</div>
        <div class="vs">${played
          ? `${escapeHTML(game.intHomeScore)} - ${escapeHTML(game.intAwayScore)}`
          : "VS"}</div>
        <div>${away}</div>
      </div>
      <div class="meta">
        <span>${escapeHTML(formatDate(game.dateEvent, game.strTime))}</span>
        <span class="pill">${played ? "Resultado" : "Jogo agendado"}</span>
      </div>
      <div class="analysis">
        <strong>Basquetebol</strong>
        <p class="muted">
          Ainda não existe um modelo histórico de previsão de basquetebol ligado.
        </p>
      </div>
    </article>`;
}

async function renderEvents(events, sport) {
  if (!events.length) {
    root.innerHTML = `
      <p class="muted">
        Não foram encontrados jogos para hoje.
        Experimenta novamente mais tarde.
      </p>`;
    subtitle.textContent = "Sem jogos encontrados";
    return;
  }

  subtitle.textContent = `${events.length} jogos encontrados`;
  root.innerHTML = '<p class="muted">A preparar os jogos e previsões...</p>';

  if (sport === "football") {
    const cards = await Promise.all(events.map(renderFootballGame));
    root.innerHTML = cards.join("");
  } else {
    root.innerHTML = events.map(renderBasketballGame).join("");
  }
}

async function loadSport(sport) {
  document.querySelectorAll(".tabs button").forEach(button => {
    button.classList.toggle("active", button.dataset.sport === sport);
  });

  heading.textContent = sport === "football"
    ? "Jogos de futebol"
    : "Jogos de basquetebol";

  subtitle.textContent = "A procurar jogos...";
  root.innerHTML = '<p class="muted">A carregar jogos reais...</p>';

  try {
    const events = sport === "football"
      ? await window.BetPredictAPI.getFootballEvents()
      : await window.BetPredictAPI.getBasketballEvents();

    await renderEvents(events, sport);
  } catch (error) {
    root.innerHTML = `
      <p class="muted">
        Não foi possível carregar os jogos.
        Verifica a ligação à internet e tenta novamente.
      </p>`;
    subtitle.textContent = "Erro ao carregar";
    console.error(error);
  }
}

document.querySelectorAll(".tabs button").forEach(button => {
  button.addEventListener("click", () => loadSport(button.dataset.sport));
});

loadSport("football");

if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("./sw.js").catch(() => {});
}
</script>
</body>
</html>
